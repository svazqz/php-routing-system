name: "Validation"
on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
  workflow_dispatch: {}
permissions:
  contents: "read"
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true
jobs:
  validate:
    name: "PHP routing tests"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 18
    steps:
      - name: "Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: "Build test container"
        run: "docker build -f tests/Dockerfile -t php-router-tests ."
      - name: "Run PHPUnit and real HTTP fixture tests"
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --network none php-router-tests | tee -a "$GITHUB_STEP_SUMMARY"
